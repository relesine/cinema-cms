name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: 后端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '17'
          cache: maven

      - name: 运行单元测试并打包
        working-directory: backend
        run: mvn -B verify

      - name: 上传后端制品
        uses: actions/upload-artifact@v4
        with:
          name: cms-server-jar
          path: backend/target/cms-server.jar
          retention-days: 7

  frontend-build:
    name: 前端规范检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com || npm ci

      - name: ESLint 规范检查
        run: npm run lint:check

      - name: Vite 生产构建
        run: npm run build

      - name: 上传前端制品
        uses: actions/upload-artifact@v4
        with:
          name: cms-frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build:
    name: Docker 镜像冒烟构建
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: 构建后端镜像
        run: docker build -t cms-server:ci ./backend

      - name: 构建前端镜像
        run: docker build -t cms-web:ci ./frontend

      - name: 校验 Compose 配置
        run: docker compose config -q
