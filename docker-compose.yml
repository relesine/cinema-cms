# ============================================================
# 星光国际影城 CMS 容器编排
# 一键启动：cp .env.example .env 改密码后 docker compose up -d --build
# 访问：前端 http://localhost:8073 （用户/员工/管理三端同一入口）
#       后端 http://localhost:8080/api （仅容器内网；调试可临时放开端口）
# ============================================================
name: cms

services:
  mysql:
    image: mysql:8.0
    container_name: cms-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"   # 宿主机 3307，避免与本机 phpStudy MySQL(3306) 冲突
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-cms}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库建表 + 种子数据
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: cms-redis
    restart: unless-stopped
    ports:
      - "6380:6379"   # 宿主机 6380，避免与本机 Redis(6379) 冲突
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: cms-server:latest
    container_name: cms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-cms}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FILE_UPLOAD_PATH: /data/uploads/
      JWT_SECRET: ${JWT_SECRET:-starlight-cms-secret-key-2026-please-change-in-prod-0123456789}
      JWT_EXPIRE: ${JWT_EXPIRE:-86400000}
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    volumes:
      - uploads-data:/data/uploads
      - backend-logs:/app/logs
    # 调试后端可放开下面两行（默认只经前端 Nginx 反代访问）
    # ports:
    #   - "8080:8080"

  web:
    build: ./frontend
    image: cms-web:latest
    container_name: cms-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8073:80"

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  backend-logs:
